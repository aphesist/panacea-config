# Video decoding stays on the Intel iGPU (VA-API, iHD). Without this, Qt Multimedia's FFmpeg
# backend (the island's media viewer) probes CUDA first and keeps /dev/nvidia* open, so the
# RTX never sleeps again until the shell restarts.
QT_FFMPEG_DECODING_HW_DEVICE_TYPES=vaapi
QT_FFMPEG_ENCODING_HW_DEVICE_TYPES=vaapi
LIBVA_DRIVER_NAME=iHD
