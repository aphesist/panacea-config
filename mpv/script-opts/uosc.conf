# Panacea look for uosc: white for what's active (like the kit's "on" tiles), black panels,
# red only for errors and search matches. Square-ish kit corners, thin timeline.
color=foreground=ffffff,foreground_text=000000,background=000000,background_text=ffffff,window_border=000000,curtain=000000,success=ffffff,error=d71921,match=d71921,heatmap=d71921
opacity=timeline=0.85,chapters=0.6,slider=0.9,slider_gauge=1,speed=0.6,menu=1,submenu=0.4,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.75,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8
timeline_style=line
timeline_line_width=2
timeline_size=36
progress=windowed
progress_size=2
top_bar=no-border
top_bar_size=36
border_radius=10
font_scale=1
font_bold=no
text_border=1
volume=right
autohide=yes
