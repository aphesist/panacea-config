# Panacea look: black, white, greys, one red; JetBrains Mono. uosc draws the controls.
# Video decodes on the Intel iGPU (VA-API) so the RTX stays asleep; native Wayland.
# OpenGL on Wayland: EGL is limited to Mesa (Intel) by environment.d/50-egl-mesa.conf, so mpv
# never even loads the NVIDIA driver (Vulkan would enumerate the RTX and wake it).
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
hwdec=vaapi
profile=high-quality

keep-open=yes
save-position-on-quit=yes
autofit-larger=80%x80%
background-color='#000000'

# uosc replaces the stock controls and window border
osc=no
osd-bar=no
border=no
osd-font='JetBrains Mono'
osd-font-size=26
osd-color='#FFFFFF'
osd-border-color='#000000'

sub-font='JetBrains Mono'
sub-font-size=40
sub-color='#FFFFFF'
sub-border-color='#000000'
sub-border-size=2.5

screenshot-dir=~/Pictures/Screenshots
screenshot-template='mpv-%F-%P'
screenshot-format=png
