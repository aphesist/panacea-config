# hypridle for Panacea (lives in custom/ so updates keep it).
# Started from custom/autostart.lua with: hypridle -c <this file>
#
# Battery: lock 5 min, screen off 5.5 min, suspend 15 min
# AC:      lock 10 min, screen off 11 min, never suspend
# Panacea's "Keep awake" toggle holds a systemd idle inhibitor, which
# hypridle honours (ignore_systemd_inhibit defaults to false).

$A = ~/.config/hypr/custom/bin/idle-action

general {
    lock_cmd = ~/.config/hypr/custom/bin/panacea-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $A any on
    # 3 = hold suspend until the ext-session-lock is confirmed locked,
    # so the desktop never flashes on resume
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = $A bat lock
}
listener {
    timeout = 330
    on-timeout = $A bat off
    on-resume = $A any on
}
listener {
    timeout = 600
    on-timeout = $A any lock
}
listener {
    timeout = 660
    on-timeout = $A any off
    on-resume = $A any on
}
listener {
    timeout = 900
    on-timeout = $A bat suspend
}
